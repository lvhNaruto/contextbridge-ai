# ContextBridge CI — lint and build only.
# The model eval is a pre-deploy gate: python scripts/eval_harness.py
# It calls Gemini and fails the deploy if groundedness is under 95%.
# Keep it out of this workflow so every push does not spend quota.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile + import the canonical contract
        run: |
          python -m compileall -q api contextbridge_schema.py contextbridge_store.py
          python -c "import contextbridge_schema, contextbridge_store; from api.main import app; print('import OK, routes:', len(app.routes))"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
